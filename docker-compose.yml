name: airline-booking

services:
  postgres:
    image: postgres:16-alpine
    container_name: airline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airline_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-airline_booking}
      # Deterministic collation so index ordering matches CI and production.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      # Host port 5433 avoids colliding with a PostgreSQL already installed on
      # the developer's machine listening on 5432.
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-airline} -d ${POSTGRES_DB:-airline_booking}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    command:
      - postgres
      # Tuned for local development; production uses managed settings.
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      # Log slow queries so seat-lock contention is visible during development.
      - -c
      - log_min_duration_statement=200

  redis:
    image: redis:7-alpine
    container_name: airline-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction

  minio:
    image: minio/minio:latest
    container_name: airline-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    command: ['server', '/data', '--console-address', ':9001']

  # One-shot job: creates the tickets bucket, then exits.
  minio-init:
    image: minio/mc:latest
    container_name: airline-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-tickets}
    entrypoint: >
      /bin/sh -c "
      mc alias set local $$S3_ENDPOINT $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc anonymous set download local/$$S3_BUCKET &&
      echo 'minio bucket ready: '$$S3_BUCKET
      "
    restart: 'no'

volumes:
  postgres-data:
    name: airline-postgres-data
  redis-data:
    name: airline-redis-data
  minio-data:
    name: airline-minio-data
