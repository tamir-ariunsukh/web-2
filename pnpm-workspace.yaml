packages:
  - "apps/*"
  - "packages/*"

# Postinstall scripts required for native binaries and Prisma code generation.
# pnpm blocks these by default; the allowlist keeps installs reproducible without
# disabling the protection wholesale.
onlyBuiltDependencies:
  - '@apollo/protobufjs'
  - '@prisma/client'
  - '@prisma/engines'
  - argon2
  - esbuild
  - msgpackr-extract
  - prisma
  - unrs-resolver
allowBuilds:
  '@apollo/protobufjs': true
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
